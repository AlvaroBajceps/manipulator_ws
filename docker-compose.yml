services:
  ros-manipulator:
    build:
      context: .
      dockerfile: ./.devcontainer/Dockerfile
    image: alvarobajceps/ros-manipulator:nightly
    container_name: ros-manipulator
    hostname: ros-manipulator
    network_mode: "host"
    ipc: "host"
    init: true
    environment:
      - TZ=Europe/Warsaw
      - ROS_ENABLE_AUTOSTART=1
      - ROS_BUILD_ON_STARTUP=on-failure
      - SSH_PORT=2569
    volumes:
      - type: bind
        source: ./
        target: /mnt/local
        bind:
          create_host_path: false
      - type: bind
        source: ./.devcontainer/rex
        target: /etc/init.d/rex
        bind:
          create_host_path: false
      - type: bind
        source: "${REX_CONTAINER_AUTHORIZED_KEYS:-/dev/null}"
        target: /run/secrets/authorized_keys
        read_only: true # Make sure this stays read-only!
        bind:
          create_host_path: false
    restart: unless-stopped
